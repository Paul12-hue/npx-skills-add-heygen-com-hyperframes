<title>Pixel-Testlevel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: full-screen canvas game with story overlays and touch controls. Single bright comic look. */
:root {
  color-scheme: dark;
  --ink: #1a0f2e; --fg: #fffaf0; --fg2: #d9d0f0; --pink: #ff3d8b; --green: #39ff14; --gold: #ffc531; --cyan: #33e1ff; --panel: #24184e;
  --display: "Bangers", "Impact", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--ink); color: var(--fg); font-family: var(--body); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.btn { font-weight: 900; font-size: 18px; min-height: 54px; padding: 0 26px; border-radius: 16px; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.2); }
.btn.hot { background: linear-gradient(var(--pink), #c4125e); border: 0; box-shadow: 0 6px 0 #7a0a3a, 0 10px 24px rgba(255,61,139,.4); }
.btn.go { background: linear-gradient(#6aff4a, #1fb800); color: #062200; border: 0; box-shadow: 0 6px 0 #0c5a00; }
.btn:active { transform: translateY(3px); }
.btn:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
.sel { border-color: var(--green) !important; background: rgba(57,255,20,.15) !important; }

.hud { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 18px; padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; font-family: var(--display); font-size: 30px; letter-spacing: .04em; text-shadow: 0 3px 0 #000; z-index: 5; }
.hud .item { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.hud svg { width: 34px; height: 34px; filter: drop-shadow(0 2px 0 #000); }
.hud .lvl { margin-left: auto; font-size: 22px; color: var(--fg2); }
.hud .pause { pointer-events: auto; width: 52px; height: 52px; border-radius: 14px; background: rgba(0,0,0,.35); border: 2px solid rgba(255,255,255,.25); font-size: 22px; }
.bossbar { position: fixed; top: 74px; left: 50%; transform: translateX(-50%); width: min(420px, 70vw); z-index: 5; text-align: center; font-family: var(--display); font-size: 20px; letter-spacing: .06em; text-shadow: 0 2px 0 #000; pointer-events: none; }
.bossbar .bar { height: 14px; border-radius: 7px; background: rgba(0,0,0,.5); border: 2px solid #fff; overflow: hidden; margin-top: 4px; }
.bossbar .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ff3d3d, #ff9a3d); transition: width .3s; }

.pad { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 max(18px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); pointer-events: none; z-index: 6; }
.pad .grp { display: flex; gap: 20px; }
.pad .k { pointer-events: auto; width: 124px; height: 124px; border-radius: 50%; background: rgba(255,255,255,.14); border: 3px solid rgba(255,255,255,.35); display: grid; place-items: center; font-size: 52px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 #000; touch-action: none; }
.pad .k.fire { background: rgba(255,255,255,.22); border-color: rgba(255,255,255,.75); font-family: var(--display); font-size: 34px; letter-spacing: .04em; align-self: flex-end; }
.pad .k.on { background: rgba(57,255,20,.35); border-color: var(--green); }
.pad .k.jump { width: 156px; height: 156px; background: rgba(255,61,139,.28); border-color: rgba(255,61,139,.7); font-family: var(--display); font-size: 40px; letter-spacing: .04em; }

.screen { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
#title { background: radial-gradient(900px 600px at 30% 20%, #ff6a3d55, transparent 60%), radial-gradient(800px 600px at 80% 90%, #39ff1433, transparent 60%), linear-gradient(#3a1d7a, #1a0f2e); text-align: center; }
.logo { font-family: var(--display); font-size: clamp(54px, 9.5vw, 116px); line-height: .92; letter-spacing: .03em; color: var(--gold); text-shadow: 0 6px 0 #a0330a, 0 10px 0 #000, 0 0 40px rgba(255,197,49,.5); transform: rotate(-3deg); margin: 0; }
.logo span { color: var(--green); text-shadow: 0 6px 0 #0c5a00, 0 10px 0 #000, 0 0 40px rgba(57,255,20,.5); }
.tag { font-weight: 800; color: var(--fg2); font-size: 18px; margin: 18px 0 22px; }
.chars { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
.chars svg.wide { width: min(44vw, 400px); }
.chars svg { width: min(22vw, 200px); height: auto; filter: drop-shadow(0 12px 20px rgba(0,0,0,.6)); }
.stack { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.rowb { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

#story { place-items: end center; background: rgba(10,6,24,.35); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
.actor { position: fixed; bottom: 150px; width: min(34vw, 330px); transition: filter .3s, transform .3s; z-index: 11; }
.actor.l { left: 4%; } .actor.r { right: 4%; }
.actor.wide { width: min(58vw, 600px); }
.actor.dim { filter: brightness(.5) saturate(.6); transform: scale(.94); }
.actor.talk svg .mouth { animation: talk .17s infinite alternate; transform-origin: center; transform-box: fill-box; }
@keyframes talk { to { transform: scaleY(.35); } }
.textbox { position: relative; z-index: 12; width: min(1000px, 100%); box-sizing: border-box; background: linear-gradient(#2a1c5a, #160e33); border: 3px solid var(--gold); border-radius: 24px; padding: 18px 26px 24px; min-height: 124px; box-shadow: 0 10px 0 #000, 0 0 40px rgba(255,197,49,.25); }
.speaker { font-family: var(--display); font-size: 30px; letter-spacing: .05em; color: var(--gold); }
.line { font-size: 20px; font-weight: 800; line-height: 1.45; max-width: 68ch; }
.shout { font-family: var(--display); font-size: 42px; letter-spacing: .03em; color: var(--green); text-shadow: 0 3px 0 #000; }
.tap { position: absolute; right: 20px; bottom: 10px; font-size: 13px; color: var(--fg2); font-weight: 900; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.chapter { position: fixed; top: max(18px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); font-family: var(--display); font-size: 30px; letter-spacing: .08em; color: var(--cyan); text-shadow: 0 3px 0 #000; z-index: 12; white-space: nowrap; }

.card { background: linear-gradient(#2a1c5a, #160e33); border: 3px solid var(--pink); border-radius: 26px; padding: 26px 30px; width: min(560px, 100%); box-sizing: border-box; text-align: center; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 0 #000; max-height: 100%; overflow: auto; }
.card h2 { font-family: var(--display); font-size: 50px; letter-spacing: .04em; margin: 0; color: var(--gold); text-shadow: 0 4px 0 #000; }
.card p { margin: 0; color: var(--fg2); font-size: 17px; line-height: 1.5; }
.tally { display: flex; justify-content: center; gap: 26px; font-family: var(--display); font-size: 34px; letter-spacing: .04em; }
.tally div { display: flex; align-items: center; gap: 8px; }
.tally svg { width: 44px; height: 44px; }
.popcv { display: block; margin: 0 auto; background: radial-gradient(circle, rgba(255,255,255,.18), transparent 70%); border-radius: 20px; }
.popname { font-size: 24px !important; color: #fff !important; font-weight: 900; }
.popline { font-family: var(--display); font-size: 30px; letter-spacing: .04em; color: var(--green); text-shadow: 0 3px 0 #000; }
.skins { display: flex; flex-direction: column; gap: 12px; text-align: left; }
.skinrow b { font-family: var(--display); font-size: 24px; letter-spacing: .04em; color: var(--cyan); }
.skinopts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.skinopt { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px; border-radius: 16px; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.15); min-width: 120px; font-weight: 900; }
.skinopt small { font-size: 11px; color: var(--fg2); font-weight: 800; max-width: 120px; text-align: center; }
.skinopt.on { border-color: var(--green); background: rgba(57,255,20,.14); }
.skinopt.locked canvas { filter: brightness(0) opacity(.55); }
.skinopt.locked { cursor: default; opacity: .8; }
.card { width: min(760px, 100%); }
.help { text-align: left; } .help li { color: var(--fg2); line-height: 1.5; margin-bottom: 4px; }
.banner { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); font-family: var(--display); font-size: clamp(40px, 7vw, 84px); letter-spacing: .04em; color: var(--green); text-shadow: 0 5px 0 #0c5a00, 0 9px 0 #000; z-index: 8; pointer-events: none; text-align: center; width: max-content; max-width: 92vw; line-height: 1; animation: bannerIn 1.6s ease-out forwards; }
@keyframes bannerIn { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 0; } 18% { transform: translate(-50%, -50%) scale(1.12); opacity: 1; } 75% { opacity: 1; } 100% { transform: translate(-50%, -62%); opacity: 0; } }
@media (max-aspect-ratio: 1/1) { .actor { width: 44vw; bottom: 200px; } .pad .k { width: 108px; height: 108px; } .pad .k.jump { width: 136px; height: 136px; } }
@media (prefers-reduced-motion: reduce) { .banner, .tap, .actor.talk svg .mouth { animation: none !important; } }
</style>

<canvas id="cv"></canvas>
<div class="hud" id="hud" hidden>
  <div class="item" id="hMugs"></div>
  <div class="item" id="hSchn"></div>
  <div class="item" id="hLives"></div>
  <div class="lvl" id="hLevel"></div>
  <button class="pause" id="pauseBtn" type="button" aria-label="Pause">❚❚</button>
</div>
<div class="bossbar" id="bossbar" hidden><div id="bossName">OPA BRIXX</div><div class="bar"><i id="bossHp"></i></div></div>
<div class="pad" id="pad" hidden>
  <div class="grp"><button class="k" data-k="left" type="button" aria-label="Links">◀</button><button class="k" data-k="right" type="button" aria-label="Rechts">▶</button></div>
  <div class="grp"><button class="k fire" data-k="fire" type="button" aria-label="Tischtennisball schießen" hidden>PING</button><button class="k jump" data-k="jump" type="button" aria-label="Springen">HOPP</button></div>
</div>

<section class="screen" id="title">
  <div class="stack">
    <div class="chars" id="titleChars"></div>
    <h1 class="logo">TIM UND DAS<br><span>XXL-SCHNITZEL</span></h1>
    <div class="tag">Testlevel im Pixel-Look: Level 1 · Altstadt. Schriften bleiben scharf. Das echte Spiel und dein Spielstand bleiben unverändert.</div>
    <div class="rowb" id="diff">
      <button class="btn" data-d="normal" type="button">Normal · 5 Leben</button>
      <button class="btn" data-d="hard" type="button">Schwer · 3 Leben</button>
    </div>
    <div class="rowb">
      <button class="btn hot" id="newBtn" type="button">Testlevel starten</button>
      <button class="btn go" id="contBtn" type="button" hidden>Weiterspielen</button>
      <button class="btn go" id="levelsBtn" type="button" hidden>Levelauswahl</button>
      <button class="btn" id="outfitBtn" type="button" hidden>Outfits</button>
    </div>
    <div class="rowb" id="pixSize">
      <button class="btn" data-px="fein" type="button">Pixel: fein</button>
      <button class="btn" data-px="mittel" type="button">Pixel: mittel</button>
      <button class="btn" data-px="grob" type="button">Pixel: grob</button>
      <button class="btn" id="musicTitleBtn" type="button">Musik: An</button>
      <button class="btn" id="helpBtn" type="button">Steuerung</button>
    </div>
  </div>
</section>

<section class="screen" id="story" hidden>
  <div class="chapter" id="chapter"></div>
  <div class="actor l" id="actL"></div><div class="actor r" id="actR"></div>
  <div class="textbox"><div class="speaker" id="speaker"></div><div class="line" id="line"></div><div class="tap">Tippen zum Weiter</div></div>
</section>

<section class="screen" id="modal" hidden><div class="card" id="card"></div></section>

<script>
"use strict";
// ================= Character portraits (original SVG art) =================
function person(o) {
  const s = o.skin, sd = o.skinDark;
  const hair = o.hair === "afro"
    ? `<path d="M120 20 C160 16 196 40 196 78 C206 96 196 118 182 118 C176 92 160 76 120 76 C80 76 64 92 58 118 C44 118 34 96 44 78 C44 40 80 16 120 20Z" fill="${o.hairColor}"/><g fill="${o.hairLight}" opacity=".35"><circle cx="86" cy="42" r="6"/><circle cx="120" cy="32" r="7"/><circle cx="154" cy="42" r="6"/><circle cx="70" cy="70" r="5"/><circle cx="170" cy="70" r="5"/></g>`
    : o.hair === "short"
    ? `<path d="M62 92 C58 50 92 34 120 36 C152 36 180 52 176 96 C170 76 156 66 140 64 C120 62 96 64 78 74 C70 80 64 86 62 92Z" fill="${o.hairColor}"/><path d="M78 70 C100 54 140 52 164 70" stroke="${o.hairLight}" stroke-width="5" fill="none" stroke-linecap="round" opacity=".5"/>`
    : `<path d="M60 96 C56 52 90 30 120 30 C152 30 184 52 180 98 L178 86 C172 72 70 72 62 86Z" fill="#141418"/><path d="M68 80 C100 70 140 70 172 80" stroke="#c0c4d6" stroke-width="2.5" fill="none" stroke-dasharray="3 5"/><path d="M176 84 l22 18 l-8 4 l14 14 l-24 -16z" fill="#141418"/>`;
  const body = o.outfit === "jersey" && o.wide
    ? `<path d="M-114 300 C-104 214 10 184 120 184 C230 184 344 214 354 300Z" fill="#65b32e"/><path d="M-114 300 C-110 256 -94 228 -66 210 L-34 300Z M354 300 C350 256 334 228 306 210 L274 300Z" fill="#ffffff" opacity=".9"/><path d="M84 186 L120 222 L156 186" fill="none" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/><path d="M-50 206 C0 192 50 188 84 188 M290 206 C240 192 190 188 156 188" stroke="#2f7a12" stroke-width="6" fill="none"/><text x="120" y="284" font-family="Bangers, Impact, sans-serif" font-size="56" text-anchor="middle" fill="#ffffff">19</text>`
    : o.outfit === "jersey"
    ? `<path d="M6 300 C10 222 52 192 120 192 C188 192 230 222 234 300Z" fill="#65b32e"/><path d="M6 300 C8 262 18 236 36 220 L58 300Z M234 300 C232 262 222 236 204 220 L182 300Z" fill="#ffffff" opacity=".9"/><path d="M92 194 L120 222 L148 194" fill="none" stroke="#ffffff" stroke-width="9" stroke-linejoin="round"/><path d="M40 212 C60 204 76 200 92 198 M200 212 C180 204 164 200 148 198" stroke="#2f7a12" stroke-width="5" fill="none"/><text x="120" y="282" font-family="Bangers, Impact, sans-serif" font-size="46" text-anchor="middle" fill="#ffffff">19</text>`
    : o.outfit === "hoodie"
    ? `<path d="M20 300 C24 230 58 196 120 196 C182 196 216 230 220 300Z" fill="${o.top}"/><path d="M74 204 C88 236 152 236 166 204 C150 196 90 196 74 204Z" fill="${o.topDark}"/><path d="M104 226 L100 270 M136 226 L140 270" stroke="#e8e8ee" stroke-width="3" stroke-linecap="round"/><circle cx="100" cy="272" r="3" fill="#e8e8ee"/><circle cx="140" cy="272" r="3" fill="#e8e8ee"/><path d="M82 262 L158 262 L162 300 L78 300Z" fill="${o.topDark}" opacity=".6"/>`
    : `<path d="M18 300 C22 228 60 198 120 198 C180 198 218 228 222 300Z" fill="#17171d"/><path d="M96 200 L120 250 L144 200" fill="${s}"/><path d="M92 214 C104 252 136 252 148 214" fill="none" stroke="#e9e2d0" stroke-width="5" stroke-dasharray="1 7" stroke-linecap="round"/><path d="M86 210 C100 268 140 268 154 210" fill="none" stroke="#7a7f99" stroke-width="5" stroke-dasharray="1 8" stroke-linecap="round"/><path d="M120 262 l0 24 M112 272 l16 0" stroke="#d8d8e2" stroke-width="4" stroke-linecap="round"/>`;
  const mouth = o.grin
    ? `<path class="mouth" d="M98 160 C108 178 132 178 142 160 Z" fill="#5a1f1f"/><path d="M101 161 C110 167 130 167 139 161 L139 164 C130 169 110 169 101 164Z" fill="#fff"/>`
    : `<path class="mouth" d="M104 162 C112 170 128 170 136 162 C128 166 112 166 104 162Z" fill="#7a2b2b" stroke="#7a2b2b" stroke-width="3" stroke-linejoin="round"/>`;
  const ex = o.wide ? 40 : 0;
  return `<svg ${o.wide ? 'class="wide" viewBox="-120 0 480 300"' : 'viewBox="0 0 240 300"'} xmlns="http://www.w3.org/2000/svg">${body}
    <rect x="${102 - ex / 2}" y="170" width="${36 + ex}" height="34" rx="12" fill="${sd}"/>
    <ellipse cx="${66 - ex}" cy="128" rx="10" ry="15" fill="${sd}"/><ellipse cx="${174 + ex}" cy="128" rx="10" ry="15" fill="${sd}"/>
    ${o.earring ? `<circle cx="64" cy="146" r="4" fill="#c9cdd8"/><circle cx="176" cy="146" r="4" fill="#c9cdd8"/>` : ""}
    <g transform="${o.wide ? "translate(120 0) scale(1.75 1.04) translate(-120 0)" : ""}"><path d="M66 110 C66 66 92 46 120 46 C148 46 174 66 174 110 C174 158 154 190 120 190 C86 190 66 158 66 110Z" fill="${s}"/>
    ${o.wide ? `<path d="M80 172 C96 194 144 194 160 172" fill="${sd}" opacity=".45"/>` : ""}</g>
    <ellipse cx="${88 - ex * .6}" cy="146" rx="12" ry="7" fill="#ff7b7b" opacity="${o.blush ?? .28}"/><ellipse cx="${152 + ex * .6}" cy="146" rx="12" ry="7" fill="#ff7b7b" opacity="${o.blush ?? .28}"/>
    ${o.wide ? `<g transform="translate(120 0) scale(1.55 1.08) translate(-120 0)">${hair}</g>` : hair}
    ${o.arms ? `<g stroke-linecap="round"><path d="M-20 206 L-104 200 M260 206 L344 200" stroke="${s}" stroke-width="30"/><path d="M-20 206 L-56 204 M260 206 L296 204" stroke="#ffffff" stroke-width="38"/></g><g fill="${s}"><circle cx="-106" cy="200" r="17"/><circle cx="346" cy="200" r="17"/></g>` : ""}
    <path d="${o.angry ? "M84 98 l28 10 M156 98 l-28 10" : "M86 104 q13 -7 26 0 M128 104 q13 -7 26 0"}" stroke="${o.brow}" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="99" cy="122" rx="${o.eyeW}" ry="7" fill="#fff"/><ellipse cx="141" cy="122" rx="${o.eyeW}" ry="7" fill="#fff"/>
    <circle cx="100" cy="123" r="4.6" fill="${o.iris}"/><circle cx="142" cy="123" r="4.6" fill="${o.iris}"/><circle cx="100" cy="123" r="2.2" fill="#111"/><circle cx="142" cy="123" r="2.2" fill="#111"/><circle cx="102" cy="121" r="1.3" fill="#fff"/><circle cx="144" cy="121" r="1.3" fill="#fff"/>
    <path d="M120 126 C116 138 114 144 120 147 C124 148 128 146 128 143" stroke="${sd}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    ${mouth}</svg>`;
}
const PORTRAIT = {
  tim: () => dress(PORTRAIT.timBase(), OVL["tim_" + skinOf("tim")]),
  valle: () => skinOf("valle") === "default" ? PORTRAIT.valleBase() : dress(person({ skin: "#e3a27c", skinDark: "#c98560", hair: "short", hairColor: "#2a2a2a", hairLight: "#444", outfit: "black", brow: "#8a6a55", iris: "#5f8fb5", eyeW: 10, grin: true, earring: true }), OVL["valle_" + skinOf("valle")]),
  faroo: (emote, angry) => dress(PORTRAIT.farooBase(emote, angry), OVL["faroo_" + skinOf("faroo")]),
  timBase: () => person({ skin: "#f2c6a8", skinDark: "#dba585", hair: "short", hairColor: "#6b4a2f", hairLight: "#9a7250", outfit: "hoodie", top: "#5e6170", topDark: "#4a4c59", brow: "#5a3d27", iris: "#5b4a3a", eyeW: 9 }),
  farooBase: (emote, angry) => person({ skin: "#7a4a2e", skinDark: "#5e3720", hair: "afro", hairColor: "#17110c", hairLight: "#5a4636", outfit: "jersey", brow: "#17110c", iris: "#3a2414", eyeW: 10, grin: true, wide: true, blush: .12, arms: emote, angry }),
  valleBase: () => person({ skin: "#e3a27c", skinDark: "#c98560", hair: "bandana", outfit: "black", brow: "#8a6a55", iris: "#5f8fb5", eyeW: 10, grin: true, earring: true }),
  bot: () => `<svg viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg">
    <path d="M18 300 C22 228 60 198 120 198 C180 198 218 228 222 300Z" fill="#6b7f4a"/><path d="M100 200 L120 236 L140 200Z" fill="#e9e2d0"/>
    <circle cx="120" cy="246" r="4" fill="#d8c9a0"/><circle cx="120" cy="264" r="4" fill="#d8c9a0"/><circle cx="120" cy="282" r="4" fill="#d8c9a0"/>
    <rect x="102" y="170" width="36" height="34" rx="12" fill="#d9a888"/>
    <ellipse cx="66" cy="128" rx="10" ry="15" fill="#d9a888"/><ellipse cx="174" cy="128" rx="10" ry="15" fill="#d9a888"/>
    <path d="M66 112 C66 64 92 44 120 44 C148 44 174 64 174 112 C174 154 154 188 120 188 C86 188 66 154 66 112Z" fill="#efc3a4"/>
    <ellipse cx="102" cy="64" rx="18" ry="7" fill="#fff" opacity=".45" transform="rotate(-15 102 64)"/>
    <path d="M62 120 C54 96 62 80 74 76 C72 92 74 106 80 118Z M178 120 C186 96 178 80 166 76 C168 92 166 106 160 118Z" fill="#f2f2f2"/>
    <path d="M84 102 l26 6 M156 102 l-26 6" stroke="#f2f2f2" stroke-width="7" stroke-linecap="round"/>
    <g fill="none" stroke="#222" stroke-width="4"><circle cx="99" cy="124" r="15"/><circle cx="141" cy="124" r="15"/><path d="M114 124 h12"/></g>
    <circle cx="100" cy="125" r="4.5" fill="#3a5a7a"/><circle cx="142" cy="125" r="4.5" fill="#3a5a7a"/>
    <path d="M120 128 C116 140 114 146 120 149 C124 150 128 148 128 145" stroke="#c98d6c" stroke-width="3.5" fill="none" stroke-linecap="round"/>

// ================= Level builder =================
const T = 48, ROWS = 14;
function builder(w, theme, name) {
  const g = Array.from({ length: ROWS }, () => Array(w).fill("."));
  const L = { w, g, theme, name, ents: [], start: [2, 10], finish: null, checkpoints: [], movers: [], mugTotal: 0 };
  const set = (x, y, ch) => { if (x >= 0 && x < w && y >= 0 && y < ROWS) g[y][x] = ch; };
  L.ground = (a, b, top = 12) => { for (let x = a; x <= b; x++) for (let y = top; y < ROWS; y++) set(x, y, "#"); return L; };
  L.brick = (x, y, n = 1) => { for (let i = 0; i < n; i++) set(x + i, y, "B"); return L; };
  L.wall = (x, top, bottom = 13) => { for (let y = top; y <= bottom; y++) set(x, y, "#"); return L; };
  L.plat = (x, y, n) => { for (let i = 0; i < n; i++) set(x + i, y, "="); return L; };
  L.spikes = (a, b, y = 11) => { for (let x = a; x <= b; x++) set(x, y, "^"); return L; };
  L.mugs = (x, y, n = 1, dx = 1, dy = 0) => { for (let i = 0; i < n; i++) { L.ents.push({ t: "mug", x: x + i * dx, y: y + i * dy }); L.mugTotal++; } return L; };
  L.arc = (x, y, n) => { for (let i = 0; i < n; i++) { const k = i / (n - 1); L.ents.push({ t: "mug", x: x + i, y: y - Math.round(Math.sin(k * Math.PI) * 2) }); L.mugTotal++; } return L; };
  L.schn = (x, y) => { L.ents.push({ t: "schn", x, y }); return L; };
  L.outfit = (x, y, who, id) => { L.ents.push({ t: "outfit", x, y, who, id }); return L; };
  // Optional wall-jump shaft: two hanging walls (rows 5-9, you can walk under them), ledge with a hidden outfit on top of the right wall.
  // Route: jump, wall jump left wall -> right wall, wall jump back, double jump while holding right.
  L.shaft = (x, who, id) => { L.wall(x, 5, 9).wall(x + 5, 5, 9).brick(x + 6, 5, 3).mugs(x + 1, 8, 4).mugs(x + 1, 6, 4); if (who) L.outfit(x + 7, 4, who, id); else L.mugs(x + 6, 4, 3); return L; };
  L.enemy = (x, y = 11, kind = "bot") => { L.ents.push({ t: kind, x, y }); return L; };
  L.check = (x, y = 11) => { L.checkpoints.push([x, y]); return L; };
  L.mover = (x, y, n, range, speed = 1.4) => { L.movers.push({ x: x * T, y: y * T, w: n * T, x0: x * T, range: range * T, speed }); return L; };
  L.startAt = (x, y) => { L.start = [x, y]; return L; };
  L.finishAt = (x, y = 11) => { L.finish = [x, y]; return L; };
  return L;
}
