<title>Kaskade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: one-screen game. Landscape = panel | board | panel, portrait = stacked. Single deliberate dark "night canyon" look. */
:root {
  color-scheme: dark;
  --bg: #0b1126; --bg2: #141d42; --slab: #18235a; --slab-deep: #0c1230; --hole: #070b1a;
  --fg: #f4f1ea; --fg2: #b8c0dc; --muted: #7c86aa; --line: rgba(255,255,255,.14); --glass: rgba(255,255,255,.07);
  --sun: #ffa733; --sun-l: #ffe2a8; --sun-d: #c2410c;
  --moon: #5cc8ff; --moon-l: #d3f3ff; --moon-d: #3346c9;
  --stone-n: #5d6380; --stone-nl: #a7adc2; --stone-nd: #2c3049;
  --crystal: #7ff5e1; --energy: #ffe27a; --danger: #ff6b6b; --ok: #6be39b;
  --display: "Fredoka", "Nunito", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: radial-gradient(1200px 700px at 15% 0%, #24306a 0%, transparent 60%), radial-gradient(900px 600px at 95% 100%, #3a2560 0%, transparent 60%), var(--bg);
  color: var(--fg); font-family: var(--body); font-size: 16px; overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
.app { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: .14em; background: linear-gradient(90deg, var(--sun-l), var(--sun), var(--moon), #5c6cff); -webkit-background-clip: text; background-clip: text; color: transparent; margin-right: auto; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
.btn { font-family: var(--body); font-weight: 800; font-size: 15px; padding: 0 18px; min-height: 46px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); color: var(--fg); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: linear-gradient(var(--sun), #e0531f); color: #24140a; border: 0; }
.btn:focus-visible, .ab:focus-visible, .opt:focus-visible { outline: 3px solid var(--crystal); outline-offset: 2px; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(200px, 250px) 1fr minmax(200px, 250px); gap: 16px; align-items: center; }
.panel { background: var(--glass); border: 1px solid var(--line); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px; transition: box-shadow .3s, border-color .3s; min-width: 0; }
.panel.active.sun { border-color: var(--sun); box-shadow: 0 0 28px rgba(255,167,51,.35); }
.panel.active.moon { border-color: var(--moon); box-shadow: 0 0 28px rgba(92,200,255,.35); }
.ph { display: flex; align-items: center; gap: 12px; }
.ph .mini { width: 40px; height: 40px; position: relative; flex: none; }
.pname { font-family: var(--display); font-weight: 600; font-size: 20px; }
.pstate { font-size: 13px; font-weight: 700; color: var(--muted); }
.panel.active .pstate { color: var(--fg2); }
.energy { display: flex; align-items: center; gap: 6px; }
.energy .bolt { color: var(--energy); font-weight: 800; font-size: 14px; }
.pip { width: 28px; height: 11px; border-radius: 6px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15); transition: all .35s; }
.pip.on { background: linear-gradient(var(--energy), #ffb300); box-shadow: 0 0 8px rgba(255,226,122,.7); border-color: rgba(255,255,255,.5); }
.ready { font-size: 11px; font-weight: 800; color: var(--danger); margin-left: auto; }
.abilities { display: flex; flex-direction: column; gap: 8px; }
.ab { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 10px; text-align: left; padding: 9px 12px; min-height: 52px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); }
.ab b { font-family: var(--display); font-weight: 600; font-size: 16px; display: block; }
.ab small { font-size: 11px; color: var(--fg2); display: block; line-height: 1.25; }
.ab .cost { display: flex; gap: 3px; } .ab .cost i { width: 6px; height: 6px; border-radius: 50%; background: var(--energy); }
.ab.poor { opacity: .4; }
.ab.armed { background: linear-gradient(var(--crystal), #2fc4b2); color: #0b1128; border-color: #fff; }
.ab.armed small { color: #0b1128; }
.ab svg { width: 24px; height: 24px; }
.center { display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 0; height: 100%; justify-content: center; }
.status { min-height: 42px; padding: 0 18px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 600; font-size: 17px; text-align: center; transition: background .2s; }
.status.err { background: rgba(255,107,107,.15); border-color: rgba(255,107,107,.5); color: var(--danger); }
.boardwrap { position: relative; width: min(100%, calc((100% ) * 1)); flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; width: 100%; }
.board { position: relative; touch-action: none; }
.lane { position: absolute; left: 0; right: 0; top: 0; }
.slab { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 26px; background: linear-gradient(#24306a, var(--slab) 40%, var(--slab-deep)); border: 2px solid rgba(255,255,255,.18); box-shadow: 0 24px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.25); }
.grid { position: absolute; }
.hole { position: absolute; border-radius: 50%; background: radial-gradient(circle at 50% 35%, var(--hole), #0b1128 60%, #1a2556); }
.col { position: absolute; border-radius: 14px; transition: background .15s; }
.col.legal { background: rgba(127,245,225,.10); outline: 1.5px solid rgba(127,245,225,.25); }
.col.hover { background: rgba(255,255,255,.14); }
.col.bad { background: rgba(255,107,107,.25); }
.stone { position: absolute; border-radius: 50%; transition: top .48s cubic-bezier(.32,1.35,.55,1), left .3s, opacity .3s, transform .3s; will-change: top; }
.stone::after { content: ""; position: absolute; left: 22%; top: 10%; width: 42%; height: 24%; border-radius: 50%; background: linear-gradient(rgba(255,255,255,.8), rgba(255,255,255,0)); }
.s1 { background: radial-gradient(circle at 35% 30%, var(--sun-l), var(--sun) 45%, var(--sun-d)); box-shadow: 0 4px 10px rgba(0,0,0,.4), 0 0 10px rgba(255,167,51,.35); }
.s2 { background: radial-gradient(circle at 35% 30%, var(--moon-l), var(--moon) 45%, var(--moon-d)); box-shadow: 0 4px 10px rgba(0,0,0,.4), 0 0 10px rgba(92,200,255,.35); }
.s3 { background: radial-gradient(circle at 35% 30%, var(--stone-nl), var(--stone-n) 50%, var(--stone-nd)); box-shadow: 0 4px 10px rgba(0,0,0,.4); }
.s3::before { content: "ᛉ"; position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,.55); font-weight: 800; }
.stone.win { animation: pulse .8s ease-in-out infinite alternate; }
@keyframes pulse { to { transform: scale(1.1); box-shadow: 0 0 26px var(--energy), 0 0 6px #fff; } }
.stone.gone { transform: scale(1.6); opacity: 0; }
.stone.ghost { opacity: .4; transition: none; pointer-events: none; }
.stone.last { outline: 2px solid rgba(255,255,255,.65); outline-offset: -35%; }
.crystal { position: absolute; display: grid; place-items: center; pointer-events: none; animation: bob 1.6s ease-in-out infinite alternate; }
.crystal svg { width: 48%; filter: drop-shadow(0 0 8px var(--crystal)); }
@keyframes bob { from { transform: translateY(-5%); } to { transform: translateY(5%); } }
.burst { position: absolute; display: grid; place-items: center; pointer-events: none; font-family: var(--display); font-weight: 700; color: var(--energy); animation: rise 1s ease-out forwards; text-shadow: 0 0 10px var(--crystal); }
@keyframes rise { from { transform: translateY(0) scale(.7); opacity: 1; } to { transform: translateY(-80%) scale(1.3); opacity: 0; } }
.overlay { position: fixed; inset: 0; background: rgba(4,7,18,.72); display: grid; place-items: center; z-index: 20; padding: 16px; }
.card { background: linear-gradient(#1b2550, #10183a); border: 1px solid var(--line); border-radius: 28px; padding: 26px; width: min(560px, 100%); max-height: 100%; overflow: auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.card h2 { font-family: var(--display); font-weight: 700; font-size: 32px; margin: 0; text-wrap: balance; }
.card h3 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 800; }
.card p, .card li { color: var(--fg2); line-height: 1.5; margin: 0; }
.card ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
.opt { padding: 12px; border-radius: 16px; background: rgba(255,255,255,.06); border: 1.5px solid rgba(255,255,255,.1); text-align: left; min-height: 52px; }
.opt b { font-family: var(--display); font-weight: 600; font-size: 16px; display: block; }
.opt small { color: var(--fg2); font-size: 12px; }
.opt.sel { border-color: var(--crystal); background: rgba(127,245,225,.12); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.big { font-family: var(--display); font-weight: 700; font-size: 44px; text-align: center; margin: 0; }
.sub { text-align: center; }
@media (max-aspect-ratio: 1/1) {
  main { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; gap: 10px; }
  .panel { padding: 12px; gap: 8px; }
  .abilities { flex-direction: row; }
  .ab { grid-template-columns: 22px 1fr auto; min-height: 46px; padding: 6px 10px; flex: 1; }
  .ab small { display: none; }
  .ph .mini { width: 32px; height: 32px; }
  #panel2 { order: 0; } .center { order: 1; } #panel1 { order: 2; }
}
@media (max-width: 520px) { .brand { font-size: 22px; } .btn { padding: 0 12px; font-size: 14px; } .ab b { font-size: 13px; } }
@media (prefers-reduced-motion: reduce) { .stone, .crystal, .burst, .stone.win { transition: none !important; animation: none !important; } }
</style>

<div class="app">
  <header>
    <div class="brand">KASKADE</div>
    <button class="btn" id="undoBtn" type="button">↶ Zurück</button>
    <button class="btn" id="rulesBtn" type="button">Regeln</button>
    <button class="btn primary" id="newBtn" type="button">Neues Spiel</button>
  </header>
  <main>
    <section class="panel sun" id="panel1"></section>
    <div class="center">
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="boardwrap" id="boardwrap">
        <div class="board" id="board" aria-label="Spielbrett">
          <div class="slab" id="slab"></div>
          <div class="grid" id="grid"></div>
          <div id="layer"></div>
        </div>
      </div>
    </div>
    <section class="panel moon" id="panel2"></section>
  </main>
</div>
<div class="overlay" id="overlay" hidden><div class="card" id="card"></div></div>

<script>
"use strict";
// ---------- Rules engine (port of KaskadeCore) ----------
const C = 7, R = 6, N = C * R;
const COST = { a: 2, g: 2, r: 3 };
const MAXE = 3;
const CRYSTALS = [[1,1],[5,1],[2,3],[4,3]];
const idx = (c, r) => c * R + r;
const WINDOWS = [];
for (let c = 0; c < C; c++) for (let r = 0; r < R; r++)
  for (const [dc, dr] of [[1,0],[0,1],[1,1],[1,-1]]) {
    const ec = c + 3*dc, er = r + 3*dr;
    if (ec < 0 || ec >= C || er < 0 || er >= R) continue;
    WINDOWS.push([0,1,2,3].map(i => idx(c + i*dc, r + i*dr)));
  }

function newState(abilities) {
  const s = { cells: new Int8Array(N), cry: new Int8Array(N), e: [0, 0, 1], to: 1, pend: false, out: 0, n: 0, ab: abilities };
  if (abilities) for (const [c, r] of CRYSTALS) s.cry[idx(c, r)] = 1; else s.e = [0, 0, 0];
  return s;
}
function clone(s) { return { cells: s.cells.slice(), cry: s.cry.slice(), e: s.e.slice(), to: s.to, pend: s.pend, out: s.out, n: s.n, ab: s.ab }; }
function height(s, c) { let h = 0; while (h < R && s.cells[c*R + h]) h++; return h; }
function four(s, p) { const x = s.cells; for (const w of WINDOWS) if (x[w[0]] === p && x[w[1]] === p && x[w[2]] === p && x[w[3]] === p) return true; return false; }
function legal(s) {
  if (s.out) return [];
  const m = [];
  for (let c = 0; c < C; c++) if (height(s, c) < R) m.push({ k: "d", c });
  if (s.pend || !s.ab) return m;
  const e = s.e[s.to];
  if (e >= COST.g) for (let c = 0; c < C; c++) if (height(s, c) < R) m.push({ k: "g", c });
  if (e >= COST.a && N - s.n >= 2) for (let c = 0; c < C; c++) if (height(s, c) < R) m.push({ k: "a", c });
  if (e >= COST.r) for (let c = 0; c < C; c++) if (height(s, c) > 0) m.push({ k: "r", c });
  return m;
}
function check(s, m) {
  if (s.out) return "Die Partie ist beendet.";
  if (s.pend && m.k !== "d") return "Jetzt folgt ein normaler Wurf.";
  if (m.k !== "d") {
    if (!s.ab) return "In dieser Arena gibt es keine Fähigkeiten.";
    if (s.e[s.to] < COST[m.k]) return `${NAMES[m.k]} braucht ${COST[m.k]} Energie, vorhanden: ${s.e[s.to]}.`;
  }
  const h = height(s, m.c);
  if ((m.k === "d" || m.k === "g" || m.k === "a") && h >= R) return "Diese Spalte ist voll.";
  if (m.k === "a" && N - s.n < 2) return "Kein Platz mehr für Anker und Wurf.";
  if (m.k === "r" && h === 0) return "Hier gibt es keinen Stein zum Entfernen.";
  return null;
}
function apply(s0, m, fx) {
  const s = clone(s0), p = s.to, o = 3 - p, c = m.c, h = height(s, c);
  if (m.k !== "d") s.e[p] -= COST[m.k];
  const claim = i => { if (!s.cry[i]) return; s.cry[i] = 0; const w = s.cells[i]; if (w === 1 || w === 2) s.e[w] = Math.min(MAXE, s.e[w] + 1); if (fx) fx.crystals.push({ i, by: w }); };
  if (m.k === "d") { s.cells[idx(c, h)] = p; s.n++; claim(idx(c, h)); }
  else if (m.k === "a") { s.cells[idx(c, h)] = 3; s.n++; claim(idx(c, h)); }
  else if (m.k === "g") { for (let r = h; r > 0; r--) s.cells[idx(c, r)] = s.cells[idx(c, r - 1)]; s.cells[idx(c, 0)] = p; s.n++; claim(idx(c, h)); }
  else { s.cells[idx(c, h - 1)] = 0; s.n--; if (fx) fx.removed = idx(c, h - 1); }
  s.pend = m.k === "a" || m.k === "r";
  s.out = four(s, p) ? p : four(s, o) ? o : 0;
  if (!s.out) {
    if (!s.pend) s.to = o;
    const full = s.n >= N;
    if (full && !(s.ab && !s.pend && s.e[s.to] >= COST.r)) s.out = 3;
  }
  return s;
}
function winCells(s) {
  const set = new Set(); if (s.out !== 1 && s.out !== 2) return set;
  for (const w of WINDOWS) if (w.every(i => s.cells[i] === s.out)) w.forEach(i => set.add(i));
  return set;
}

// ---------- AI: negamax + alpha-beta, iterative deepening ----------
const WIN = 1000000;
const LEVELS = {
  apprentice: { name: "Lehrling", desc: "Locker, übersieht manches", depth: 2, time: 300, noise: 45, short: .3, ab: .35 },
  strategist: { name: "Stratege", desc: "Denkt voraus", depth: 4, time: 700, noise: 10, short: 0, ab: .85 },
  master: { name: "Meister", desc: "Rechnet tief", depth: 6, time: 900, noise: 0, short: 0, ab: 1 },
  grandmaster: { name: "Großmeister", desc: "Volle Rechenkraft", depth: 20, time: 1600, noise: 0, short: 0, ab: 1 },
};
const ODD = new Int8Array(N); for (let i = 0; i < N; i++) ODD[i] = (i % R) % 2 === 0 ? 1 : 0;
const WW = [0, 1, 5, 22, 0];
function evaluate(s, p) {
  const x = s.cells, o = 3 - p; let t = 0;
  for (const w of WINDOWS) {
    let m = 0, th = 0, neu = false, emp = -1;
    for (const i of w) { const v = x[i]; if (v === p) m++; else if (v === o) th++; else if (v === 3) neu = true; else emp = i; }
    if (neu || (m && th)) continue;
    if (m) { t += WW[m]; if (m === 3 && emp >= 0 && (ODD[emp] === 1) === (p === 1)) t += 12; }
    else if (th) { t -= WW[th]; if (th === 3 && emp >= 0 && (ODD[emp] === 1) === (o === 1)) t -= 12; }
  }
  for (let r = 0; r < R; r++) { const v = x[idx(3, r)]; if (v === p) t += 3; else if (v === o) t -= 3; }
  if (s.ab) { t += 7 * (s.e[p] - s.e[o]); if (s.e[p] >= 3) t += 8; if (s.e[o] >= 3) t -= 8; }
  return t;
}
const ORDER = [3, 2, 4, 1, 5, 0, 6], KR = { d: 0, g: 10, a: 20, r: 30 };
function ordered(ms, first) { return ms.sort((a, b) => (a === first ? -1e3 : KR[a.k] + Math.abs(a.c - 3)) - (b === first ? -1e3 : KR[b.k] + Math.abs(b.c - 3))); }
let deadline = 0, nodes = 0, aborted = false, useAb = true;
function childScore(s, m, depth, a, b, ply) {
  const ch = apply(s, m);
  if (ch.out === 1 || ch.out === 2) return ch.out === s.to ? WIN - ply : -(WIN - ply);
  if (ch.out === 3) return 0;
  if (ch.to === s.to) return negamax(ch, depth, a, b, ply + 1);
  return -negamax(ch, depth - 1, -b, -a, ply + 1);
}
function negamax(s, depth, a, b, ply) {
  if ((++nodes & 1023) === 0 && performance.now() > deadline) aborted = true;
  if (aborted) return 0;
  const me = s.to;
  for (let c = 0; c < C; c++) { const h = height(s, c); if (h < R) { s.cells[idx(c, h)] = me; const w = four(s, me); s.cells[idx(c, h)] = 0; if (w) return WIN - ply - 1; } }
  if (depth <= 0) return evaluate(s, me);
  let ms = legal(s); if (!useAb || ply > 4) ms = ms.filter(m => m.k === "d");
  let best = -Infinity;
  for (const m of ordered(ms)) {
    const v = childScore(s, m, depth, a, b, ply); if (aborted) return 0;
    if (v > best) best = v; if (v > a) a = v; if (a >= b) break;
  }
  return best;
}
function chooseMove(s, lvl) {
  const L = LEVELS[lvl], ms = legal(s); if (ms.length <= 1) return ms[0];
  useAb = Math.random() < L.ab;
  const depth = Math.random() < L.short ? 1 : L.depth;
  nodes = 0; aborted = false; deadline = performance.now() + L.time;
  if (L.noise > 0) {
    const sc = ordered(ms.slice()).map(m => ({ m, v: childScore(s, m, depth, -WIN - 1, WIN + 1, 0) }));
    const best = Math.max(...sc.map(x => x.v));
    const cand = sc.filter(x => x.v === best || (x.v >= best - L.noise && x.v > -WIN / 2));
    return cand[Math.floor(Math.random() * cand.length)].m;
  }
  let bestMove = ordered(ms.slice())[0];
  for (let d = 1; d <= depth; d++) {
    let a = -WIN - 1, bm = null, bv = -Infinity;
    for (const m of ordered(legal(s), d > 1 ? bestMove : null)) {
      const v = childScore(s, m, d, a, WIN + 1, 0); if (aborted) break;
      if (v > bv) { bv = v; bm = m; } if (v > a) a = v;
    }
    if (aborted && d > 1) break;
    if (bm) bestMove = bm;
    if (aborted || Math.abs(bv) > WIN / 2) break;
  }
  // map back to an object from a fresh legal list
  return legal(s).find(m => m.k === bestMove.k && m.c === bestMove.c);
}

// ---------- Game controller ----------
const NAMES = { a: "Anker", g: "Geysir", r: "Spalt" };
const RULE = { a: "Neutraler Stein, dann wirfst du normal.", g: "Eigener Stein von unten, die Spalte steigt.", r: "Obersten Stein entfernen, dann wirfst du." };
const ICON = {
  a: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z"/><path d="M7.5 12h9"/></svg>',
  g: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="4" r="1.6" fill="currentColor"/><path d="M5 13l7-5 7 5"/><path d="M5 19l7-5 7 5" opacity=".6"/></svg>',
  r: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="9" opacity=".5"/><path d="M14 1.5l-4.5 10 5 1.5-4.5 9.5"/></svg>',
};
const CRY_SVG = '<svg viewBox="0 0 62 100"><path d="M31 0L56 38 31 100 6 38z" fill="#7ff5e1"/><path d="M31 0L56 38H31z" fill="#e6fffa"/><path d="M6 38H31V100z" fill="#2fc4b2"/></svg>';

let cfg = { mode: "ai", level: "strategist", human: 1, ab: true };
let state, history, pieces, nextId, armed = null, hover = null, busy = false, lastPlaced = null, errTimer = null, result = null, aiTimer = null, gen = 0;

function save() { try { localStorage.setItem("kaskade", JSON.stringify({ cfg, history })); } catch (e) {} }
function load() { try { return JSON.parse(localStorage.getItem("kaskade") || "null"); } catch (e) { return null; } }

function trackerFrom(s0, hist) {
  pieces = Array.from({ length: C }, () => []); nextId = 0;
  let s = s0;
  for (const m of hist) { trackApply(m, s.to); s = apply(s, m); }
}
function trackApply(m, p) {
  const col = pieces[m.c];
  if (m.k === "d") col.push({ id: nextId++, o: p });
  else if (m.k === "a") col.push({ id: nextId++, o: 3 });
  else if (m.k === "g") col.unshift({ id: nextId++, o: p, rise: true });
  else col.pop();
}
function isAI(p) { return cfg.mode === "ai" && p !== cfg.human; }
function name(p) {
  if (cfg.mode === "ai") return p === cfg.human ? "Du" : "KI · " + LEVELS[cfg.level].name;
  return p === 1 ? "Sonne" : "Mond";
}

function startGame(newCfg, hist) {
  gen++; clearTimeout(aiTimer);
  if (newCfg) cfg = newCfg;
  history = []; state = newState(cfg.ab); result = null; armed = null; lastPlaced = null; busy = false;
  for (const m of hist || []) { if (check(state, m)) break; state = apply(state, m); history.push(m); }
  trackerFrom(newState(cfg.ab), history);
  layer.innerHTML = ""; stoneEls.clear();
  hideOverlay(); render(true); save();
  if (state.out) finish(); else scheduleAI();
}

function play(m) {
  const err = check(state, m); if (err) { flash(err, m.c); return false; }
  const fx = { crystals: [], removed: null }, p = state.to;
  state = apply(state, m, fx); history.push(m); trackApply(m, p);
  armed = null;
  const col = pieces[m.c];
  lastPlaced = m.k === "g" ? col[0].id : (m.k === "r" ? null : col[col.length - 1].id);
  sound(m.k, m.k === "d" ? height(state, m.c) : 0);
  render(); save();
  for (const cr of fx.crystals) burst(cr.i, cr.by ? "+1" : "✕");
  if (state.out) finish(); else scheduleAI();
  return true;
}

function scheduleAI() {
  if (!isAI(state.to) || state.out) { busy = false; render(); return; }
  busy = true; render();
  const g = gen;
  aiTimer = setTimeout(() => {
    if (g !== gen) return;
    const m = chooseMove(state, cfg.level);
    if (g !== gen) return;
    busy = false;
    if (m) play(m);
  }, state.pend ? 420 : 620);
}

function undo() {
  if (busy || !history.length) return;
  let s = newState(cfg.ab); const states = [s];
  for (const m of history) { s = apply(s, m); states.push(s); }
  let t = history.length - 1;
  if (cfg.mode === "ai") { while (t >= 0 && isAI(states[t].to)) t--; if (t < 0) return; }
  while (t > 0 && states[t].pend) t--;
  startGame(null, history.slice(0, t));
}

function finish() {
  render();
  const o = state.out;
  sound(o === 3 ? "draw" : (isAI(o) ? "lose" : "win"));
  setTimeout(() => {
    let title, sub;
    if (o === 3) { title = "Remis"; sub = "Das Brett ist erschöpft, niemand kann mehr ziehen."; }
    else if (cfg.mode === "ai") { title = o === cfg.human ? "Sieg!" : "Niederlage"; sub = o === cfg.human ? `Stark gespielt gegen ${LEVELS[cfg.level].name}.` : "Die KI war diesmal schneller."; }
    else { title = (o === 1 ? "Sonne" : "Mond") + " gewinnt!"; sub = "Vier in einer Reihe."; }
    if (cfg.mode === "ai" && o !== 3) {
      try { const st = JSON.parse(localStorage.getItem("kaskade-stats") || "{}"); const k = cfg.level; st[k] = st[k] || [0, 0]; st[k][o === cfg.human ? 0 : 1]++; localStorage.setItem("kaskade-stats", JSON.stringify(st)); } catch (e) {}
    }
    showCard(`<p class="big">${title}</p><p class="sub">${sub}</p>${statsLine()}<div class="row" style="justify-content:center"><button class="btn primary" id="again">Revanche</button><button class="btn" id="setup2">Neues Spiel</button><button class="btn" id="look">Brett ansehen</button></div>`);
    document.getElementById("again").onclick = () => startGame(cfg);
    document.getElementById("setup2").onclick = showSetup;
    document.getElementById("look").onclick = hideOverlay;
  }, 1300);
}
function statsLine() {
  try { const st = JSON.parse(localStorage.getItem("kaskade-stats") || "{}"); const parts = Object.keys(LEVELS).filter(k => st[k]).map(k => `${LEVELS[k].name} ${st[k][0]}:${st[k][1]}`); return parts.length ? `<p class="sub" style="font-size:13px">Deine Bilanz (Siege:Niederlagen) · ${parts.join(" · ")}</p>` : ""; } catch (e) { return ""; }
}

// ---------- Rendering ----------
const board = document.getElementById("board"), slab = document.getElementById("slab"), grid = document.getElementById("grid"), layer = document.getElementById("layer"), wrap = document.getElementById("boardwrap");
const stoneEls = new Map();
let cell = 60, pad = 18;
function layout() {
  const W = wrap.clientWidth, H = wrap.clientHeight;
  cell = Math.max(28, Math.min(W / (C + .6), H / (R + 1.6)));
  pad = cell * .3;
  const bw = C * cell + 2 * pad, bh = R * cell + 2 * pad;
  board.style.width = bw + "px"; board.style.height = (bh + cell) + "px";
  slab.style.height = bh + "px";
  grid.style.left = pad + "px"; grid.style.top = (cell + pad) + "px";
  grid.innerHTML = "";
  for (let c = 0; c < C; c++) {
    const col = document.createElement("div"); col.className = "col"; col.dataset.c = c;
    Object.assign(col.style, { left: (c * cell + cell * .04) + "px", top: (-pad * .5) + "px", width: (cell * .92) + "px", height: (R * cell + pad) + "px" });
    grid.appendChild(col);
    for (let r = 0; r < R; r++) {
      const h = document.createElement("div"); h.className = "hole"; const d = cell * .86;
      Object.assign(h.style, { left: (c * cell + (cell - d) / 2) + "px", top: ((R - 1 - r) * cell + (cell - d) / 2) + "px", width: d + "px", height: d + "px" });
      grid.appendChild(h);
    }
  }
  render(true);
}
function pos(c, r) { const d = cell * .84; return { x: pad + c * cell + (cell - d) / 2, y: cell + pad + (R - 1 - r) * cell + (cell - d) / 2, d }; }

function render(instant) {
  // stones
  const alive = new Set(), wins = winCells(state);
  pieces.forEach((col, c) => col.forEach((pc, r) => {
    alive.add(pc.id);
    const p = pos(c, r);
    let el = stoneEls.get(pc.id);
    if (!el) {
      el = document.createElement("div"); el.className = "stone s" + pc.o; stoneEls.set(pc.id, el);
      el.style.width = el.style.height = p.d + "px"; el.style.left = p.x + "px";
      if (instant) el.style.top = p.y + "px";
      else if (pc.rise) { el.style.top = (p.y + cell) + "px"; el.style.opacity = "0"; }
      else el.style.top = (pos(c, R).y - cell * .2) + "px";
      layer.appendChild(el);
      void el.offsetWidth;
    }
    el.style.width = el.style.height = p.d + "px"; el.style.left = p.x + "px"; el.style.top = p.y + "px"; el.style.opacity = "";
    el.classList.toggle("win", wins.has(idx(c, r)));
    el.classList.toggle("last", pc.id === lastPlaced && !state.out);
  }));
  for (const [id, el] of stoneEls) if (!alive.has(id)) { stoneEls.delete(id); el.classList.add("gone"); setTimeout(() => el.remove(), 320); }
  // crystals
  layer.querySelectorAll(".crystal").forEach(e => e.remove());
  for (let i = 0; i < N; i++) if (state.cry[i]) {
    const c = Math.floor(i / R), r = i % R, p = pos(c, r), e = document.createElement("div");
    e.className = "crystal"; Object.assign(e.style, { left: p.x + "px", top: p.y + "px", width: p.d + "px", height: p.d + "px" }); e.innerHTML = CRY_SVG; layer.appendChild(e);
  }
  // ghost + columns
  layer.querySelectorAll(".ghost").forEach(e => e.remove());
  const human = canAct(), kind = armed || "d", legalCols = new Set(human ? legal(state).filter(m => m.k === kind).map(m => m.c) : []);
  grid.querySelectorAll(".col").forEach(col => { const c = +col.dataset.c; col.classList.toggle("legal", human && !!armed && legalCols.has(c)); col.classList.toggle("hover", human && hover === c && legalCols.has(c)); });
  if (human && hover !== null && legalCols.has(hover)) {
    const g = document.createElement("div"), p = pos(hover, R);
    g.className = "stone ghost s" + (kind === "a" ? 3 : state.to); Object.assign(g.style, { left: p.x + "px", top: (p.y + cell * .05) + "px", width: p.d + "px", height: p.d + "px" }); layer.appendChild(g);
  }
  renderPanels(); renderStatus();
  document.getElementById("undoBtn").disabled = busy || !history.length;
}
function canAct() { return !state.out && !busy && !isAI(state.to) && document.getElementById("overlay").hidden; }

function renderPanels() {
  for (const p of [1, 2]) {
    const el = document.getElementById("panel" + p), active = !state.out && state.to === p;
    el.classList.toggle("active", active);
    const e = state.e[p];
    let html = `<div class="ph"><div class="mini"><div class="stone s${p}" style="width:100%;height:100%;left:0;top:0"></div></div><div><div class="pname">${name(p)}</div><div class="pstate">${active ? (busy ? "denkt nach …" : state.pend ? "Wirf jetzt" : "Am Zug") : (p === 1 ? "Sonne" : "Mond")}</div></div></div>`;
    if (state.ab) {
      html += `<div class="energy"><span class="bolt">⚡</span>${[0,1,2].map(i => `<span class="pip${i < e ? " on" : ""}"></span>`).join("")}${e >= 3 ? '<span class="ready">Spalt bereit</span>' : ""}</div><div class="abilities">`;
      for (const k of ["a", "g", "r"]) {
        html += `<button type="button" class="ab${e < COST[k] ? " poor" : ""}${active && armed === k ? " armed" : ""}" data-p="${p}" data-k="${k}" aria-pressed="${active && armed === k}">${ICON[k]}<span><b>${NAMES[k]}</b><small>${RULE[k]}</small></span><span class="cost">${"<i></i>".repeat(COST[k])}</span></button>`;
      }
      html += "</div>";
    } else html += `<p style="margin:0;color:var(--muted);font-size:14px">Klassische Regeln, ohne Fähigkeiten.</p>`;
    el.innerHTML = html;
  }
}
function renderStatus(msg) {
  const st = document.getElementById("status");
  if (msg) { st.textContent = msg; st.classList.add("err"); return; }
  if (errTimer) return;
  st.classList.remove("err");
  if (state.out === 3) st.textContent = "Remis";
  else if (state.out) st.textContent = cfg.mode === "ai" ? (state.out === cfg.human ? "Sieg!" : "Niederlage") : `${name(state.out)} gewinnt!`;
  else if (busy) st.textContent = `${name(state.to)} überlegt …`;
  else if (state.pend) st.textContent = "Jetzt folgt dein normaler Wurf.";
  else if (armed) st.textContent = `${NAMES[armed]}: Wähle eine Spalte. Antippen der Fähigkeit bricht ab.`;
  else st.textContent = name(state.to) === "Du" ? "Du bist am Zug. Tippe auf eine Spalte." : `${name(state.to)} ist am Zug.`;
}
function flash(msg, c) {
  sound("bad");
  clearTimeout(errTimer); errTimer = null; renderStatus(msg);
  if (c !== undefined) { const col = grid.querySelector(`.col[data-c="${c}"]`); col && col.classList.add("bad"); setTimeout(() => col && col.classList.remove("bad"), 450); }
  errTimer = setTimeout(() => { errTimer = null; renderStatus(); }, 2000);
}
function burst(i, text) {
  const c = Math.floor(i / R), r = i % R, p = pos(c, r), e = document.createElement("div");
  e.className = "burst"; e.textContent = text; Object.assign(e.style, { left: p.x + "px", top: p.y + "px", width: p.d + "px", height: p.d + "px", fontSize: (p.d * .4) + "px" });
  layer.appendChild(e); setTimeout(() => e.remove(), 1000);
}

// ---------- Input ----------
function colAt(ev) { const b = board.getBoundingClientRect(); const x = ev.clientX - b.left - pad; if (ev.clientX < b.left || ev.clientX > b.right) return null; return Math.max(0, Math.min(C - 1, Math.floor(x / cell))); }
let dragging = false;
board.addEventListener("pointerdown", ev => { dragging = true; board.setPointerCapture(ev.pointerId); hover = colAt(ev); render(); });
board.addEventListener("pointermove", ev => { if (!dragging && ev.pointerType !== "mouse") return; const c = colAt(ev); if (c !== hover) { hover = c; render(); } });
board.addEventListener("pointerup", ev => {
  dragging = false; const c = colAt(ev); hover = null;
  if (c === null) { render(); return; }
  if (state.out) { render(); return; }
  if (!canAct()) { if (busy) flash("Warte, der Gegner ist am Zug."); render(); return; }
  play({ k: armed || "d", c }) || render();
});
board.addEventListener("pointerleave", () => { if (!dragging) { hover = null; render(); } });
board.addEventListener("pointercancel", () => { dragging = false; hover = null; render(); });
document.querySelector("main").addEventListener("click", ev => {
  const b = ev.target.closest(".ab"); if (!b) return;
  const p = +b.dataset.p, k = b.dataset.k;
  if (state.out || p !== state.to || !canAct()) return;
  if (state.pend) return flash("Erst den normalen Wurf beenden.");
  if (state.e[p] < COST[k]) return flash(`${NAMES[k]} braucht ${COST[k]} Energie, du hast ${state.e[p]}.`);
  armed = armed === k ? null : k; sound("tap"); render();
});
document.getElementById("undoBtn").onclick = undo;
document.getElementById("newBtn").onclick = showSetup;
document.getElementById("rulesBtn").onclick = showRules;
window.addEventListener("resize", layout);

// ---------- Overlays ----------
const overlay = document.getElementById("overlay"), card = document.getElementById("card");
function showCard(html) { card.innerHTML = html; overlay.hidden = false; render(); }
function hideOverlay() { overlay.hidden = true; if (state) render(); }
function showSetup() {
  let d = { ...cfg };
  const draw = () => {
    const opt = (grp, val, title, sub) => `<button type="button" class="opt${d[grp] === val ? " sel" : ""}" data-g="${grp}" data-v="${val}"><b>${title}</b><small>${sub}</small></button>`;
    card.innerHTML = `<h2>Neues Spiel</h2>
      <h3>Modus</h3><div class="opts">${opt("mode", "ai", "Gegen KI", "Solo, 4 Stufen")}${opt("mode", "duel", "Duell", "Zwei Spieler, ein iPad")}</div>
      ${d.mode === "ai" ? `<h3>Gegner</h3><div class="opts">${Object.entries(LEVELS).map(([k, L]) => opt("level", k, L.name, L.desc)).join("")}</div>
      <h3>Deine Seite</h3><div class="opts">${opt("human", 1, "Sonne", "Beginnt die Partie")}${opt("human", 2, "Mond", "Startet mit 1 Energie")}</div>` : ""}
      <h3>Arena</h3><div class="opts">${opt("ab", true, "Ursprung", "Kristalle und Fähigkeiten")}${opt("ab", false, "Klassik", "Nur die Grundregel")}</div>
      <div class="row"><button type="button" class="btn primary" id="go">Spiel starten</button><button type="button" class="btn" id="cancel">Abbrechen</button></div>`;
    card.querySelectorAll(".opt").forEach(b => b.onclick = () => { const g = b.dataset.g; let v = b.dataset.v; if (g === "human") v = +v; if (g === "ab") v = v === "true"; d[g] = v; sound("tap"); draw(); });
    document.getElementById("go").onclick = () => startGame(d);
    document.getElementById("cancel").onclick = hideOverlay;
  };
  overlay.hidden = false; draw(); render();
}
function showRules() {
  showCard(`<h2>So geht Kaskade</h2>
    <p>Tippe auf eine Spalte (oder zieh den Finger über das Brett und lass los). Der Stein fällt auf den tiefsten freien Platz. <b style="color:var(--fg)">Vier eigene Steine in einer Reihe</b> gewinnen: waagerecht, senkrecht oder diagonal.</p>
    <h3>Kristalle und Energie</h3>
    <p>Wer ein Kristallfeld zuerst mit einem eigenen Stein besetzt, bekommt 1 Energie (höchstens 3). Die Sonne beginnt, der Mond startet dafür mit 1 Energie.</p>
    <h3>Fähigkeiten</h3>
    <ul><li><b style="color:var(--fg)">Anker (2):</b> neutraler Stein, der niemandem gehört. Danach wirfst du sofort normal.</li>
    <li><b style="color:var(--fg)">Geysir (2):</b> dein Stein kommt von unten in die Spalte, alles darüber steigt eine Reihe. Bekommen dabei beide eine Reihe, gewinnt, wer gezogen hat. Bekommt nur der Gegner eine, gewinnt er.</li>
    <li><b style="color:var(--fg)">Spalt (3):</b> entferne den obersten Stein einer Spalte, danach wirfst du sofort. Steht dein Gegner auf 3 Energie, reicht ein einzelner Block nicht.</li></ul>
    <p>Fähigkeit antippen, dann Spalte wählen. Pro Zug höchstens eine Fähigkeit.</p>
    <div class="row"><button type="button" class="btn primary" id="ok">Los geht's</button></div>`);
  document.getElementById("ok").onclick = hideOverlay;
}

// ---------- Sound (Web Audio, after first touch) ----------
let ac = null;
function sound(kind, row) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime, tone = (f, d, v, type, delay) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = type || "sine"; o.frequency.value = f; g.gain.setValueAtTime(v, t + (delay || 0)); g.gain.exponentialRampToValueAtTime(.0001, t + (delay || 0) + d); o.connect(g).connect(ac.destination); o.start(t + (delay || 0)); o.stop(t + (delay || 0) + d + .05); };
    if (kind === "d") { tone(392 * Math.pow(2, (row || 0) / 6), .25, .18); tone(95, .15, .25); }
    else if (kind === "a") { tone(110, .45, .3); tone(55, .4, .2); }
    else if (kind === "g") { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(180, t); o.frequency.linearRampToValueAtTime(800, t + .6); g.gain.setValueAtTime(.15, t); g.gain.exponentialRampToValueAtTime(.0001, t + .65); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .7); }
    else if (kind === "r") { tone(900, .3, .2, "sawtooth"); tone(300, .3, .15, "square", .05); }
    else if (kind === "win") [523, 659, 784, 1046].forEach((f, i) => tone(f, .9, .15, "sine", i * .11));
    else if (kind === "lose") [440, 349, 294].forEach((f, i) => tone(f, .8, .17, "sine", i * .22));
    else if (kind === "draw") tone(587, .7, .15);
    else if (kind === "bad") { tone(150, .08, .15, "square"); tone(150, .08, .15, "square", .12); }
    else if (kind === "tap") tone(1800, .05, .1);
  } catch (e) {}
}

// ---------- Boot ----------
const saved = load();
if (saved && saved.cfg && Array.isArray(saved.history)) { cfg = saved.cfg; state = newState(cfg.ab); history = []; pieces = Array.from({ length: C }, () => []); }
else { state = newState(true); history = []; pieces = Array.from({ length: C }, () => []); }
layout();
startGame(cfg, saved && Array.isArray(saved.history) ? saved.history : []);
if (!saved) showRules();
</script>
