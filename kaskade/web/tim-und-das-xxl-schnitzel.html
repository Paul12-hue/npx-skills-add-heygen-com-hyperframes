    : `<path d="M18 300 C22 228 60 198 120 198 C180 198 218 228 222 300Z" fill="#17171d"/><path d="M96 200 L120 250 L144 200" fill="${s}"/><path d="M92 214 C104 252 136 252 148 214" fill="none" stroke="#e9e2d0" stroke-width="5" stroke-dasharray="1 7" stroke-linecap="round"/><path d="M86 210 C100 268 140 268 154 210" fill="none" stroke="#7a7f99" stroke-width="5" stroke-dasharray="1 8" stroke-linecap="round"/><path d="M120 262 l0 24 M112 272 l16 0" stroke="#d8d8e2" stroke-width="4" stroke-linecap="round"/>`;

  return `<svg viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg">${body}

}
const PORTRAIT = {

    <path d="M18 300 C22 228 60 198 120 198 C180 198 218 228 222 300Z" fill="#6b7f4a"/><path d="M100 200 L120 236 L140 200Z" fill="#e9e2d0"/>

const MUG_SVG = `<svg viewBox="0 0 40 40"><path d="M8 10 h20 v18 a6 6 0 0 1 -6 6 h-8 a6 6 0 0 1 -6 -6z" fill="#39ff14" stroke="#0c5a00" stroke-width="2.5"/><path d="M28 14 h3 a5 5 0 0 1 0 10 h-3" fill="none" stroke="#0c5a00" stroke-width="5"/><path d="M28 14 h3 a5 5 0 0 1 0 10 h-3" fill="none" stroke="#39ff14" stroke-width="2.5"/><rect x="11" y="13" width="4" height="14" rx="2" fill="#d8ffcc" opacity=".8"/></svg>`;

// ================= Level builder =================
const T = 48, ROWS = 14;
function builder(w, theme, name) {
  const g = Array.from({ length: ROWS }, () => Array(w).fill("."));
  const L = { w, g, theme, name, ents: [], start: [2, 10], finish: null, checkpoints: [], movers: [], mugTotal: 0 };
  const set = (x, y, ch) => { if (x >= 0 && x < w && y >= 0 && y < ROWS) g[y][x] = ch; };
  L.ground = (a, b, top = 12) => { for (let x = a; x <= b; x++) for (let y = top; y < ROWS; y++) set(x, y, "#"); return L; };
  L.brick = (x, y, n = 1) => { for (let i = 0; i < n; i++) set(x + i, y, "B"); return L; };
  L.wall = (x, top, bottom = 13) => { for (let y = top; y <= bottom; y++) set(x, y, "#"); return L; };
  L.plat = (x, y, n) => { for (let i = 0; i < n; i++) set(x + i, y, "="); return L; };
  L.spikes = (a, b, y = 11) => { for (let x = a; x <= b; x++) set(x, y, "^"); return L; };
  L.mugs = (x, y, n = 1, dx = 1, dy = 0) => { for (let i = 0; i < n; i++) { L.ents.push({ t: "mug", x: x + i * dx, y: y + i * dy }); L.mugTotal++; } return L; };
  L.arc = (x, y, n) => { for (let i = 0; i < n; i++) { const k = i / (n - 1); L.ents.push({ t: "mug", x: x + i, y: y - Math.round(Math.sin(k * Math.PI) * 2) }); L.mugTotal++; } return L; };
  L.schn = (x, y) => { L.ents.push({ t: "schn", x, y }); return L; };
  L.enemy = (x, y = 11, kind = "bot") => { L.ents.push({ t: kind, x, y }); return L; };
  L.check = (x, y = 11) => { L.checkpoints.push([x, y]); return L; };
  L.mover = (x, y, n, range, speed = 1.4) => { L.movers.push({ x: x * T, y: y * T, w: n * T, x0: x * T, range: range * T, speed }); return L; };
  L.startAt = (x, y) => { L.start = [x, y]; return L; };
  L.finishAt = (x, y = 11) => { L.finish = [x, y]; return L; };
  return L;
}

    .check(76).ground(76, 96).brick(80, 10, 5).plat(82, 8, 2).schn(82, 6).mugs(80, 9, 5)
    .enemy(88).enemy(92).ground(100, 106, 11).ground(110, 116, 10).arc(106, 9, 4).arc(116, 8, 4)
    .ground(120, 149).spikes(126, 127).mugs(123, 10, 3).enemy(132).plat(133, 10, 2).plat(136, 8, 2).schn(137, 6).mugs(138, 10, 6)
    .finishAt(146);
  const L2 = builder(170, "night", "Level 2 · Neonmarkt")
    .ground(0, 18).mugs(5, 10, 6).enemy(14)
    .ground(22, 30, 10).ground(34, 40, 8).plat(26, 8, 3).schn(27, 6).arc(30, 9, 5)
    .ground(44, 70).spikes(50, 53).plat(50, 10, 4).mugs(50, 9, 4).enemy(58).enemy(62, 11, "fast").mugs(57, 10, 8)

// ================= Game engine =================
const cv = $("cv"), ctx = cv.getContext("2d");
let LEVELS = makeLevels();
let G = null; // running level
const input = { left: false, right: false, jump: false, jumpPressed: false };
let dpr = 1, scale = 1, vw = 0, vh = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  scale = cv.height / (ROWS * T); vw = cv.width / scale; vh = ROWS * T;
}
addEventListener("resize", resize); resize();

const solid = ch => ch === "#" || ch === "B";
function tileAt(tx, ty) { if (ty < 0) return "."; if (ty >= ROWS || tx < 0 || tx >= G.L.w) return tx < 0 || tx >= G.L.w ? "#" : "."; return G.L.g[ty][tx]; }

function playLevel(n) {
  return new Promise(resolve => {
    const L = LEVELS[n];
    const lives = G && G.keepLives ? G.lives : (difficulty === "hard" ? 3 : 5);
    G = {
      n, L, resolve, lives, mugs: 0, schn: 0, mugBank: 0, time: 0,
      ents: L.ents.map(e => ({ ...e, px: e.x * T, py: e.y * T, alive: true, vx: e.t === "fast" ? -2.4 : -1.2, bob: Math.random() * 6 })),
      movers: L.movers.map(m => ({ ...m, dir: 1, dx: 0 })),
      checkpoint: [L.start[0] * T, L.start[1] * T - 4], reached: new Set(),
      particles: [], cam: 0, paused: false, done: false, shake: 0,
      boss: n === 3 ? { x: 10 * T, y: 2 * T, w: 120, h: 110, hp: difficulty === "hard" ? 5 : 3, maxHp: difficulty === "hard" ? 5 : 3, state: "fly", t: 0, vx: 2.4, inv: 0, bombs: [] } : null,
    };
    spawnPlayer();
    screen(null); updateHud();
    $("bossbar").hidden = !G.boss;
    banner(n === 3 ? "BOSS!" : L.name.split("·")[1].trim());
    if (n === 3) sfx("boss");
    last = performance.now(); acc = 0;
    requestAnimationFrame(loop);
  });
}
function spawnPlayer() { G.p = { x: G.checkpoint[0], y: G.checkpoint[1], w: 30, h: 44, vx: 0, vy: 0, ground: false, coyote: 0, buffer: 0, face: 1, inv: 90, anim: 0, onMover: null }; }

let last = 0, acc = 0;
function loop(now) {
  if (!G || G.done) return;
  const dt = Math.min(100, now - last); last = now;
  if (!G.paused) { acc += dt; while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; if (!G || G.done) return; } }
  draw();
  requestAnimationFrame(loop);
}

function hurt() {
  const p = G.p; if (p.inv > 0 || G.done) return;
  G.lives--; sfx("hurt"); G.shake = 14; burst(p.x + p.w / 2, p.y + p.h / 2, "#ff3d5a", 18);
  updateHud();
  if (G.lives <= 0) return gameOver();
  spawnPlayer();
}
function gameOver() {
  G.done = true; const n = G.n, res = G.resolve;
  modal(`<h2>Keine Leben mehr</h2><p>Valle: „Kopf hoch, Tim. Kein Schnitzel ohne Anlauf. Nochmal!“</p><div class="rowb"><button class="btn hot" id="retryBtn" type="button">Level neu starten</button><button class="btn" id="quitBtn" type="button">Titelbildschirm</button></div>`);
  $("retryBtn").onclick = () => { G = null; playLevel(n).then(res); };
  $("quitBtn").onclick = () => { G = null; res("quit"); };
}
function finishLevel() {
  if (G.done) return; G.done = true; sfx("win");
  const r = { mugs: G.mugs, schn: G.schn }, res = G.resolve, lives = G.lives;
  banner(G.boss ? "Gewonnen!" : "Alta GiG!");
  setTimeout(() => { G = { keepLives: true, lives }; res(r); }, 1500);
}
function burst(x, y, color, n = 10) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 4; G.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 40 + Math.random() * 20, color }); } }

function step() {
  const p = G.p, L = G.L; G.time++;
  if (p.inv > 0) p.inv--;
  // movers
  for (const m of G.movers) { const nx = m.x + m.speed * m.dir; if (nx > m.x0 + m.range || nx < m.x0) m.dir *= -1; m.dx = m.speed * m.dir; m.x += m.dx; }
  // horizontal input
  const accel = p.ground ? .9 : .55, maxV = 5.2;
  if (input.left && !input.right) { p.vx = Math.max(-maxV, p.vx - accel); p.face = -1; }
  else if (input.right && !input.left) { p.vx = Math.min(maxV, p.vx + accel); p.face = 1; }
  else p.vx *= p.ground ? .72 : .94;
  if (Math.abs(p.vx) < .05) p.vx = 0;
  // jump with coyote time and buffer
  p.coyote = p.ground ? 7 : Math.max(0, p.coyote - 1);
  if (input.jumpPressed) { p.buffer = 8; input.jumpPressed = false; }
  else p.buffer = Math.max(0, p.buffer - 1);
  if (p.buffer > 0 && p.coyote > 0) { p.vy = -13.2; p.ground = false; p.coyote = 0; p.buffer = 0; sfx("jump"); }
  if (!input.jump && p.vy < -5) p.vy = -5;
  p.vy = Math.min(14, p.vy + .62);
  // carry by mover
  if (p.onMover) p.x += p.onMover.dx;
  // move X
  p.x += p.vx; collideX(p);
  // move Y
  const prevBottom = p.y + p.h;
  p.y += p.vy; p.ground = false; p.onMover = null; collideY(p, prevBottom);
  for (const m of G.movers) {
    if (p.vy >= 0 && prevBottom <= m.y + 2 && p.y + p.h >= m.y && p.x + p.w > m.x && p.x < m.x + m.w) { p.y = m.y - p.h; p.vy = 0; p.ground = true; p.onMover = m; }
  }
  p.x = Math.max(0, Math.min(L.w * T - p.w, p.x));
  if (p.y > ROWS * T + 60) return hurt();
  // spikes
  for (const [tx, ty] of overlapTiles(p, 6)) if (tileAt(tx, ty) === "^") return hurt();
  p.anim += Math.abs(p.vx) * .08;
  // entities
  for (const e of G.ents) {
    if (!e.alive) continue;
    if (e.t === "mug" || e.t === "schn") {
      const sz = e.t === "schn" ? 44 : 30;
      if (rects(p, { x: e.px + (T - sz) / 2, y: e.py + (T - sz) / 2, w: sz, h: sz })) {
        e.alive = false;
        if (e.t === "mug") { G.mugs++; G.mugBank++; sfx("mug"); burst(e.px + 24, e.py + 24, "#39ff14", 8); if (G.mugBank >= 100) { G.mugBank -= 100; G.lives++; banner("+1 Leben!"); } }
        else { G.schn++; sfx("schn"); burst(e.px + 24, e.py + 24, "#ffc531", 26); banner(G.schn === 3 ? "Alle 3 XXL-Schnitzel!" : "XXL-Schnitzel!"); }
        updateHud();
      }
      continue;
    }
    // walker enemies
    const ew = 36, eh = 34;
    e.px += e.vx;
    const ahead = e.vx < 0 ? e.px - 1 : e.px + ew + 1;
    const ty = Math.floor((e.py + eh - 1 + 14) / T);
    const wallT = tileAt(Math.floor(ahead / T), Math.floor((e.py + eh - 2 + 14) / T));
    const floorT = tileAt(Math.floor(ahead / T), ty + 1);
    if (solid(wallT) || !(solid(floorT) || floorT === "=")) e.vx *= -1;
    const box = { x: e.px, y: e.py + 14, w: ew, h: eh };
    if (rects(p, box)) {
      if (p.vy > 1 && prevBottom <= box.y + 14) { e.alive = false; p.vy = input.jump ? -12 : -8; sfx("stomp"); burst(box.x + ew / 2, box.y + eh / 2, "#b066ff", 14); }
      else return hurt();
    }
  }
  // checkpoints
  for (const [cx, cy] of L.checkpoints) { const key = cx + ":" + cy; if (!G.reached.has(key) && Math.abs(p.x - cx * T) < 40) { G.reached.add(key); G.checkpoint = [cx * T, cy * T - 4]; sfx("check"); banner("ICH HAB NEN NEUEN CHECKPOINT"); } }
  // finish
  if (L.finish && p.x > L.finish[0] * T - 20) return finishLevel();
  if (G.boss) bossStep();
  // particles
  for (const q of G.particles) { q.x += q.vx; q.y += q.vy; q.vy += .25; q.life--; }
  G.particles = G.particles.filter(q => q.life > 0);
  // camera
  const target = p.x + p.w / 2 - vw * .42;
  G.cam += (Math.max(0, Math.min(L.w * T - vw, target)) - G.cam) * .12;
  if (L.w * T < vw) G.cam = -(vw - L.w * T) / 2;
  if (G.boss) G.cam = L.w * T < vw ? -(vw - L.w * T) / 2 : 0;
  if (G.shake > 0) G.shake--;
}
function rects(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function overlapTiles(p, inset = 0) { const out = []; for (let ty = Math.floor((p.y + inset) / T); ty <= Math.floor((p.y + p.h - 1 - inset) / T); ty++) for (let tx = Math.floor((p.x + inset) / T); tx <= Math.floor((p.x + p.w - 1 - inset) / T); tx++) out.push([tx, ty]); return out; }
function collideX(p) {
  for (const [tx, ty] of overlapTiles(p)) if (solid(tileAt(tx, ty))) { if (p.vx > 0) p.x = tx * T - p.w; else if (p.vx < 0) p.x = tx * T + T; else { const mid = tx * T + T / 2; p.x = p.x + p.w / 2 < mid ? tx * T - p.w : tx * T + T; } p.vx = 0; }
}
function collideY(p, prevBottom) {
  for (const [tx, ty] of overlapTiles(p)) {
    const ch = tileAt(tx, ty);
    if (solid(ch)) {
      if (p.vy > 0) { p.y = ty * T - p.h; p.vy = 0; p.ground = true; }
      else if (p.vy < 0) { p.y = ty * T + T; p.vy = 0; if (ch === "B") bumpBrick(tx, ty); }
    } else if (ch === "=" && p.vy >= 0 && prevBottom <= ty * T + 1) { p.y = ty * T - p.h; p.vy = 0; p.ground = true; }
  }
}
function bumpBrick(tx, ty) { burst(tx * T + 24, ty * T + 40, "#d9b48a", 5); sfx("stomp"); }

// ---- boss ----
function bossStep() {
  const b = G.boss, p = G.p; if (b.hp <= 0) return;
  b.t++; if (b.inv > 0) b.inv--;
  const floorY = 12 * T - b.h, hard = difficulty === "hard";
  const flyTime = hard ? 260 : 320, groundTime = hard ? 110 : 150;
  if (b.state === "fly") {
    b.x += b.vx; if (b.x < T + 10 || b.x > (G.L.w - 2) * T - b.w - 10) b.vx *= -1;
    b.y = 2 * T + Math.sin(b.t / 20) * 18;

  ctx.fillStyle = "#f4f4f4"; ctx.beginPath(); ctx.ellipse(hx - 18, hy - 2, 7, 10, 0, 0, Math.PI * 2); ctx.ellipse(hx + 18, hy - 2, 7, 10, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.beginPath(); ctx.ellipse(hx - 5, hy - 14, 7, 3, -.3, 0, Math.PI * 2); ctx.fill();
  // glasses + eyes
  ctx.strokeStyle = "#222"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(hx - 8, hy - 1, 6, 0, Math.PI * 2); ctx.moveTo(hx + 14, hy - 1); ctx.arc(hx + 8, hy - 1, 6, 0, Math.PI * 2); ctx.moveTo(hx - 2, hy - 1); ctx.lineTo(hx + 2, hy - 1); ctx.stroke();
  ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(hx - 8 + look * 2, hy - 1, 2, 0, Math.PI * 2); ctx.arc(hx + 8 + look * 2, hy - 1, 2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#f4f4f4"; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(hx - 15, hy - 11); ctx.lineTo(hx - 3, hy - 8); ctx.moveTo(hx + 15, hy - 11); ctx.lineTo(hx + 3, hy - 8); ctx.stroke();
  // big white mustache + mouth
  ctx.fillStyle = "#f4f4f4"; ctx.beginPath(); ctx.ellipse(hx - 7, hy + 9, 9, 4.5, .25, 0, Math.PI * 2); ctx.ellipse(hx + 7, hy + 9, 9, 4.5, -.25, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#5a1f1f"; ctx.beginPath(); ctx.ellipse(hx, hy + 15, grounded ? 4 : 6, grounded ? 2 : 4, 0, 0, Math.PI * 2); ctx.fill();
  if (grounded) { ctx.fillStyle = "#ffc531"; ctx.font = "900 16px Nunito, sans-serif"; ctx.textAlign = "center"; ctx.fillText("✦ ✦", hx, hy - 30 + Math.sin(G.time / 5) * 3); }
  ctx.restore();
  // shout bubble while flying
  if (!grounded && b.hp > 0 && Math.floor(G.time / 180) % 2 === 0) {
    ctx.save(); ctx.fillStyle = "#fff"; roundRect(b.x - 60, b.y - 70, 240, 44, 12); ctx.fill();
    ctx.fillStyle = "#1a0f2e"; ctx.font = "900 15px Nunito, sans-serif"; ctx.textAlign = "center"; ctx.fillText("BADABOOM!", b.x + 60, b.y - 52); ctx.font = "800 12px Nunito, sans-serif"; ctx.fillText("HIER REGELT NUR EINER", b.x + 60, b.y - 35); ctx.restore();
  }
  // handballs
  for (const bo of b.bombs) {
    const cx = bo.x + 14, cy = bo.y + 14, rot = (G.time + bo.x) / 6;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
    ctx.fillStyle = "#f4f6fb"; ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1f5fd6"; for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 14, k * 2.09, k * 2.09 + .9); ctx.closePath(); ctx.fill(); }
    ctx.strokeStyle = "#1a2a4a"; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.beginPath(); ctx.arc(-5, -6, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

// ================= HUD =================
function updateHud() {
  if (!G || !G.L) return;
  $("hMugs").innerHTML = `${MUG_SVG}<span>${G.mugs}</span>`;
  $("hSchn").innerHTML = G.boss ? "" : `${SCHN_SVG}<span>${G.schn}/3</span>`;
  $("hLives").innerHTML = `${HEART_SVG}<span>×${G.lives}</span>`;
  $("hLevel").textContent = G.L.name;
  if (G.boss) $("bossHp").style.width = (G.boss.hp / G.boss.maxHp * 100) + "%";
}

// ================= Input =================
const keyMap = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", Space: "jump", ArrowUp: "jump", KeyW: "jump" };
addEventListener("keydown", e => { const k = keyMap[e.code]; if (k) { e.preventDefault(); if (k === "jump" && !input.jump) input.jumpPressed = true; input[k] = true; } if (e.code === "KeyP" && G && G.L) togglePause(); });
addEventListener("keyup", e => { const k = keyMap[e.code]; if (k) input[k] = false; });
const padPointers = new Map();
function refreshPad() {
  const held = new Set(padPointers.values());
  for (const k of ["left", "right", "jump"]) { const was = input[k]; input[k] = held.has(k); if (k === "jump" && input.jump && !was) input.jumpPressed = true; }
  document.querySelectorAll(".pad .k").forEach(b => b.classList.toggle("on", held.has(b.dataset.k)));
}
const padEl = $("pad");
padEl.addEventListener("pointerdown", e => { const b = e.target.closest(".k"); if (!b) return; e.preventDefault(); padPointers.set(e.pointerId, b.dataset.k); refreshPad(); });
padEl.addEventListener("pointermove", e => {
  if (!padPointers.has(e.pointerId)) return;
  const el = document.elementFromPoint(e.clientX, e.clientY), b = el && el.closest && el.closest(".k");
  if (b && b.dataset.k !== "jump" && padPointers.get(e.pointerId) !== "jump") { padPointers.set(e.pointerId, b.dataset.k); refreshPad(); }
});
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, e => { if (padPointers.delete(e.pointerId)) refreshPad(); });
document.addEventListener("contextmenu", e => e.preventDefault());
function togglePause() {
  if (!G || !G.L || G.done) return;
  G.paused = !G.paused;
  if (G.paused) {
    modal(`<h2>Pause</h2><div class="rowb"><button class="btn go" id="resBtn" type="button">Weiter</button><button class="btn" id="restartBtn" type="button">Level neu starten</button><button class="btn" id="titleBtn" type="button">Titelbildschirm</button></div>`);
    $("resBtn").onclick = togglePause;
    $("restartBtn").onclick = () => { const n = G.n, res = G.resolve; G.done = true; G = null; playLevel(n).then(res); };
    $("titleBtn").onclick = () => { const res = G.resolve; G.done = true; G = null; res("quit"); };
  } else { screen(null); last = performance.now(); acc = 0; }
}
$("pauseBtn").onclick = togglePause;
document.addEventListener("visibilitychange", () => { if (document.hidden && G && G.L && !G.paused && !G.done) togglePause(); });

// ================= Title =================
function toTitle() {
  G = null; screen("title");
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  $("titleChars").innerHTML = PORTRAIT.tim() + PORTRAIT.valle();
  $("contBtn").hidden = !(save.step > 0 && save.step < STORY.length);
  document.querySelectorAll("#diff button").forEach(b => b.classList.toggle("sel", b.dataset.d === difficulty));
}
$("diff").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; difficulty = b.dataset.d; store.write(); sfx("tap"); toTitle(); });
$("newBtn").onclick = () => { save = { step: 0, totalMugs: 0, schnitzel: {} }; store.write(); runStory(); };
$("contBtn").onclick = () => runStory();
$("helpBtn").onclick = () => helpModal(toTitle);
store.load();
toTitle();
</script>
