<script>
// Handgezeichneter Stylframe: Gouache-Flächen + raue Tuschelinien + Papierkorn.
// Alles deterministisch (seeded), damit spätere Animation (line boil) pro Frame neu "zeichnen" kann.
const W = 1920, H = 1080;
const cv = document.getElementById('c'), g = cv.getContext('2d');
let seed = Number(new URLSearchParams(location.search).get('seed') || 7);
function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
const R = (a, b) => a + (b - a) * rnd();

// ---------- Helfer ----------
function jitterPath(pts, amt, closed) {
  // unterteilt die Linie und verschiebt Punkte leicht -> zittrige Handlinie
  const out = [];
  const n = pts.length - (closed ? 0 : 1);
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const steps = Math.max(2, Math.round(len / 14));
    for (let s = 0; s < steps; s++) {
      const t = s / steps;
      out.push([a[0] + (b[0] - a[0]) * t + R(-amt, amt), a[1] + (b[1] - a[1]) * t + R(-amt, amt)]);
    }
  }
  if (!closed) out.push([pts[pts.length - 1][0] + R(-amt, amt), pts[pts.length - 1][1] + R(-amt, amt)]);
  return out;
}
function smoothTrace(p, closed) {
  g.beginPath();
  g.moveTo(p[0][0], p[0][1]);
  for (let i = 1; i < p.length - 1; i++) {
    const mx = (p[i][0] + p[i + 1][0]) / 2, my = (p[i][1] + p[i + 1][1]) / 2;
    g.quadraticCurveTo(p[i][0], p[i][1], mx, my);
  }
  g.lineTo(p[p.length - 1][0], p[p.length - 1][1]);
  if (closed) g.closePath();
}
// Gouache-Fläche: Grundfarbe, leicht versetzt zur Linie, dann Pinseltupfer für Farbunebenheit
function paint(pts, color, opts = {}) {
  const off = opts.off ?? 4;
  const p = jitterPath(pts.map(q => [q[0] + R(-off, off), q[1] + R(-off, off)]), 2.5, true);
  g.save();
  smoothTrace(p, true);
  g.fillStyle = color; g.fill();
  g.clip();
  // Pinselstriche
  const [x0, y0, x1, y1] = bbox(pts);
  const strokes = opts.strokes ?? Math.min(500, ((x1 - x0) * (y1 - y0)) / 900);
  for (let i = 0; i < strokes; i++) {
    const x = R(x0, x1), y = R(y0, y1), l = R(10, 46), ang = (opts.dir ?? 0) + R(-0.35, 0.35);
    g.strokeStyle = shade(color, R(-0.09, 0.09));
    g.globalAlpha = R(0.12, 0.35);
    g.lineWidth = R(3, 10); g.lineCap = 'round';
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(ang) * l, y + Math.sin(ang) * l); g.stroke();
  }
  // Trockenpinsel-Kante unten (dunkler)
  if (opts.shadow) {
    const gr = g.createLinearGradient(0, y0, 0, y1);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, opts.shadow);
    g.globalAlpha = 1; g.fillStyle = gr; g.fillRect(x0 - 20, y0 - 20, x1 - x0 + 40, y1 - y0 + 40);
  }
  g.restore();
}
// Tuschelinie: zwei Durchgänge, Druck variiert, Linie bricht manchmal ab
function ink(pts, opts = {}) {
  const closed = !!opts.closed, base = opts.w ?? 3.2, col = opts.col ?? '#1b1530';
  for (let pass = 0; pass < (opts.passes ?? 2); pass++) {
    const p = jitterPath(pts, opts.j ?? 2.2, closed);
    if (closed) p.push(p[0]);
    g.strokeStyle = col; g.lineCap = 'round'; g.lineJoin = 'round';
    g.globalAlpha = pass ? 0.45 : 0.9;
    for (let i = 0; i < p.length - 1; i++) {
      if (rnd() < (opts.gaps ?? 0.03)) continue; // kleine Unterbrechungen wie beim Federstrich
      const t = i / p.length;
      g.lineWidth = Math.max(0.6, base * (0.55 + 0.6 * Math.sin(t * Math.PI) + R(-0.25, 0.25)) * (pass ? 0.6 : 1));
      g.beginPath(); g.moveTo(p[i][0], p[i][1]); g.lineTo(p[i + 1][0], p[i + 1][1]); g.stroke();
    }
  }
  g.globalAlpha = 1;
}
function bbox(pts) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  return [x0, y0, x1, y1];
}
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function shade(c, k) {
  const [r, gg, b] = hex(c);
  const f = v => Math.max(0, Math.min(255, Math.round(k > 0 ? v + (255 - v) * k : v * (1 + k))));
  return `rgb(${f(r)},${f(gg)},${f(b)})`;
}
function glow(x, y, r, col, a) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, col.replace('A', a)); gr.addColorStop(0.35, col.replace('A', a * 0.45)); gr.addColorStop(1, col.replace('A', 0));
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
}
// Klumpige Schneekante: Polygon mit welliger Unterkante
function lumpy(x0, x1, yTop, yBot, bumps) {
  const pts = [[x0, yBot]];
  for (let i = 0; i <= bumps; i++) {
    const x = x0 + (x1 - x0) * i / bumps;
    pts.push([x, yTop + R(-10, 6) - Math.sin(i / bumps * Math.PI) * 18]);
  }
  pts.push([x1, yBot]);
  return pts;
}
function pine(x, yBase, h, w, col) {
  const tiers = 5, pts = [];
  pts.push([x, yBase - h]);
  for (let i = 1; i <= tiers; i++) {
    const y = yBase - h + h * i / tiers, ww = w * (0.35 + 0.65 * i / tiers) / 2;
    pts.push([x + ww, y]); if (i < tiers) pts.push([x + ww * 0.45, y - 4]);
  }
  for (let i = tiers; i >= 1; i--) {
    const y = yBase - h + h * i / tiers, ww = w * (0.35 + 0.65 * i / tiers) / 2;
    if (i < tiers) pts.push([x - ww * 0.45, y - 4]); pts.push([x - ww, y]);
  }
  paint(pts, col, { strokes: 60, dir: 1.2 });
  ink(pts, { closed: true, w: 2, col: '#0b0d22', j: 2.5 });
  // Schnee auf den Ästen
  for (let i = 1; i <= tiers; i++) {
    const y = yBase - h + h * i / tiers - h / tiers * 0.85, ww = w * (0.35 + 0.65 * i / tiers) / 2 * 0.75;
    const s = [[x - ww * 0.6, y + 10], [x - ww * 0.2, y], [x + ww * 0.3, y + 2], [x + ww * 0.7, y + 12], [x, y + 9]];
    paint(s, '#c9d3ee', { strokes: 6, off: 2 });
  }
}

}

for (let i = 0; i < 22; i++) { const x = R(-20, W + 20); pine(x, R(640, 680), R(140, 230), R(70, 110), '#16244a'); }

{ const t=document.createElement('canvas'); t.width=W; t.height=H; t.getContext('2d').drawImage(cv,0,0);

{

}

const chim = [[1310, 300], [1370, 300], [1370, 420], [1310, 420]];

paint(lumpy(1300, 1380, 285, 310, 5), '#eef1fc', { strokes: 10, off: 2 });
// Rauch: lockere, gemalte Schlingen

  g.globalAlpha = 0.32 * (1 - i / 18); g.fillStyle = '#c3cbe8'; g.beginPath(); g.ellipse(x, y, r, r * 0.8, 0, 0, 7); g.fill(); }
g.restore();
g.save(); g.globalAlpha = 0.35;

g.restore();

paint(wall, '#7a4a3a', { strokes: 320, dir: 1.57, shadow: 'rgba(25,12,35,.55)' });

for (let i = 0; i < 420; i++) {
  const x = R(0, W), y = R(0, H), s = R(1.5, 5.5);
  g.globalAlpha = R(0.45, 0.95); g.fillStyle = '#f3f5ff';
  g.beginPath(); g.ellipse(x, y, s, s * R(0.7, 1), R(0, 3), 0, 7); g.fill();
}
g.globalAlpha = 1;

// ---------- 10. Papier, Korn, Vignette ----------
const img = g.getImageData(0, 0, W, H), d = img.data;
for (let i = 0; i < d.length; i += 4) {
  const px = (i / 4) % W, py = (i / 4 / W) | 0;
  const n = (rnd() - 0.5) * 26;                                     // Korn
  const fiber = Math.sin(px * 0.013 + Math.sin(py * 0.05) * 2) * 4; // Papierfaser
  d[i] += n + fiber + 6; d[i + 1] += n + fiber + 3; d[i + 2] += n + fiber - 4; // leicht warm/vergilbt
}
g.putImageData(img, 0, 0);
const vg = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(10,6,20,.6)');
g.fillStyle = vg; g.fillRect(0, 0, W, H);
document.title = 'done';
</script></body></html>
